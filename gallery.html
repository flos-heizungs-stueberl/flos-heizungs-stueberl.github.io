<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Galerie — Flo's Heizungsstüberl</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">Flo's Heizungsstüberl</a>
      <button class="nav-toggle" aria-expanded="false" aria-label="Menü"><span class="hamburger"></span></button>
      <nav id="main-nav">
        <a href="/">Start</a>
        <a href="speisekarte.html">Speisekarte</a>
        <a href="veranstaltungen.html">Veranstaltungen</a>
        <a href="stammtisch.html">Stammtisch</a>
        <a href="hochzeiten.html">Hochzeiten</a>
        <a href="gallery.html">Galerie</a>
        <a href="ueber-uns.html">Über uns</a>
        <a href="kontakt.html" class="cta">Kontakt</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>Galerie</h1>
    <p>Hier ein paar Eindrücke aus dem Heizungsstüberl — eingesendet, aufgenommen oder einfach gesammelt.</p>

    <div class="gallery-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem">
      <img src="Bilder/Aperol.jpg" alt="Aperol" loading="eager">
      <img src="Bilder/Betrunkener_1.jpg" alt="Betrunkener" loading="eager">
      <img src="Bilder/Betrunkener_2.jpg" alt="Betrunkener" loading="eager">
      <img src="Bilder/Flo_hinten.jpg" alt="Flo hinten" loading="eager">
      <img src="Bilder/Flo_Katze.png" alt="Flo mit Katze" loading="eager">
      <img src="Bilder/Flo_portraet_2.jpg" alt="Flo Porträt 2" loading="eager">
      <img src="Bilder/Flo_portraet_voll.jpg" alt="Flo Porträt voll" loading="eager">
      <img src="Bilder/Flo_serioes.jpg" alt="Flo seriös" loading="eager">
      <img src="Bilder/Michi_draussen.jpg" alt="Michi draußen" loading="eager">
      <img src="Bilder/Michi_portraet.jpg" alt="Michi Porträt" loading="eager">
      <img src="Bilder/Michi_schrei.jpg" alt="Michi schreit" loading="eager">
	  <img src="Bilder/Gesellige_runde.jpg" alt="Nettes Beisammensein" loading="eager">
    </div>

    <h2 style="margin-top:1.6rem">Videos</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem">
      <video controls playsinline width="100%" style="border-radius:10px" src="Videos/Goassmass.mp4" preload="metadata"></video>
      <video controls playsinline width="100%" style="border-radius:10px" src="Videos/Heizung_video.mp4" preload="metadata"></video>
    </div>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Flo's Heizungsstüberl — Hinterettenberg 8, 83487 Marktschellenberg • <a href="impressum.html">Impressum</a></p>
    </div>
  </footer>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      // Ensure images are loaded/displayed properly on mobile (some browsers hide deferred images)
      document.querySelectorAll('.gallery-grid img').forEach(function(img){ img.setAttribute('decoding','sync'); img.style.opacity=1; img.style.visibility='visible'; });

      // Mobile nav toggle (shared)
      var navToggle = document.querySelector('.nav-toggle');
      var nav = document.getElementById('main-nav');
      function closeNav(){ if(nav){ nav.classList.remove('open'); } if(navToggle){ navToggle.classList.remove('open'); navToggle.setAttribute('aria-expanded','false'); } }
      if(navToggle && nav){
        navToggle.addEventListener('click', function(e){ e.preventDefault(); var isOpen = nav.classList.toggle('open'); navToggle.classList.toggle('open', isOpen); navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false'); });
        window.addEventListener('resize', function(){ if(window.innerWidth > 600){ closeNav(); } });
        document.addEventListener('click', function(e){ if(!nav.contains(e.target) && !navToggle.contains(e.target) && nav.classList.contains('open')){ closeNav(); } });
      }
    });
  </script>
</body>
</html>
